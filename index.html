<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus & Flow - Live Music Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #0f2b3c, #1e293b);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .modes {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .mode-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .mode-btn.active, .mode-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .timer-display {
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 16px 0 24px 0;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .action-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 32px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .action-btn:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .settings {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .setting-group label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .setting-group input {
      width: 60px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      font-size: 1rem;
    }

    /* Spotify Live Display Card */
    .spotify-container {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
    }

    .spotify-auth-btn {
      width: 100%;
      background: #1ed760;
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .spotify-auth-btn:hover {
      background: #1fdf64;
    }

    .now-playing-card {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .track-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .track-art {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.1);
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: #1ed760;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #1ed760;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 215, 96, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(30, 215, 96, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 215, 96, 0); }
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #1ed760;
      width: 0%;
      transition: width 0.5s linear;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Focus & Flow</h1>

    <div class="modes">
      <button class="mode-btn active" onclick="switchMode('work', this)">Focus</button>
      <button class="mode-btn" onclick="switchMode('shortBreak', this)">Short Break</button>
      <button class="mode-btn" onclick="switchMode('longBreak', this)">Long Break</button>
    </div>

    <div class="timer-display" id="timer">25:00</div>

    <div class="controls">
      <button class="action-btn" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="secondary-btn" onclick="resetTimer()">Reset</button>
    </div>

    <div class="settings">
      <div class="setting-group">
        <label>Focus (m)</label>
        <input type="number" id="workTime" value="25" min="1" max="120" onchange="updateCustomTimes()">
      </div>
      <div class="setting-group">
        <label>Rest (m)</label>
        <input type="number" id="shortBreakTime" value="5" min="1" max="60" onchange="updateCustomTimes()">
      </div>
      <div class="setting-group">
        <label>Long (m)</label>
        <input type="number" id="longBreakTime" value="15" min="1" max="60" onchange="updateCustomTimes()">
      </div>
    </div>

    <div class="spotify-container">
      <button id="authBtn" class="spotify-auth-btn" onclick="connectSpotify()">
        <span>Connect Spotify Live Sync</span>
      </button>

      <div id="nowPlayingCard" class="now-playing-card">
        <div class="track-header">
          <img id="trackArt" class="track-art" src="" alt="Album Art">
          <div class="track-info">
            <div id="trackTitle" class="track-title">Not Playing</div>
            <div id="trackArtist" class="track-artist">Play music on your device</div>
            <div class="status-badge" id="statusBadge">
              <span class="pulse-dot"></span> <span id="statusText">Playing on Device</span>
            </div>
          </div>
        </div>
        <div class="progress-bar-container">
          <div id="progressFill" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =======================================
       SPOTIFY LIVE PLAYER MONITOR LOGIC
    ======================================= */
    const CLIENT_ID = 'YOUR_SPOTIFY_CLIENT_ID';
    const REDIRECT_URI = window.location.href.split('#')[0].split('?')[0];
    const SCOPES = ['user-read-currently-playing', 'user-read-playback-state'];

    let spotifyToken = localStorage.getItem('spotify_access_token');

    function checkAuth() {
      const hashParams = {};
      const r = /([^&;=]+)=?([^&;]*)/g;
      const q = window.location.hash.substring(1);
      let e;
      while (e = r.exec(q)) {
        hashParams[e[1]] = decodeURIComponent(e[2]);
      }

      if (hashParams.access_token) {
        spotifyToken = hashParams.access_token;
        localStorage.setItem('spotify_access_token', spotifyToken);
        window.location.hash = '';
      }

      if (spotifyToken) {
        document.getElementById('authBtn').style.display = 'none';
        document.getElementById('nowPlayingCard').style.display = 'flex';
        fetchCurrentlyPlaying();
        setInterval(fetchCurrentlyPlaying, 3000); // Check device status every 3s
      }
    }

    function connectSpotify() {
      const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES.join(' '))}&response_type=token&show_dialog=true`;
      window.location.href = authUrl;
    }

    async function fetchCurrentlyPlaying() {
      if (!spotifyToken) return;

      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { Authorization: `Bearer ${spotifyToken}` }
        });

        if (response.status === 401) {
          localStorage.removeItem('spotify_access_token');
          spotifyToken = null;
          document.getElementById('authBtn').style.display = 'block';
          document.getElementById('nowPlayingCard').style.display = 'none';
          return;
        }

        if (response.status === 204 || response.status > 400) {
          renderOfflineState();
          return;
        }

        const data = await response.json();

        if (data.item && data.is_playing) {
          document.getElementById('trackTitle').textContent = data.item.name;
          document.getElementById('trackArtist').textContent = data.item.artists.map(a => a.name).join(', ');
          document.getElementById('trackArt').src = data.item.album.images[0].url;
          
          const progressPercent = (data.progress_ms / data.item.duration_ms) * 100;
          document.getElementById('progressFill').style.width = `${progressPercent}%`;

          document.getElementById('statusBadge').style.color = '#1ed760';
          document.getElementById('statusText').textContent = 'Live on Device';
          document.querySelector('.pulse-dot').style.display = 'inline-block';
        } else {
          renderOfflineState();
        }
      } catch (err) {
        console.error('Spotify API fetch error:', err);
      }
    }

    function renderOfflineState() {
      document.getElementById('trackTitle').textContent = 'Paused / Idle';
      document.getElementById('trackArtist').textContent = 'Play music on your Spotify app';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('statusText').textContent = 'Offline';
      document.getElementById('statusBadge').style.color = '#94a3b8';
      document.querySelector('.pulse-dot').style.display = 'none';
    }

    checkAuth();

    /* =======================================
       POMODORO TIMER LOGIC
    ======================================= */
    let timerInterval = null;
    let currentMode = 'work';
    let isRunning = false;
    let audioCtx = null;

    const times = {
      work: 25 * 60,
      shortBreak: 5 * 60,
      longBreak: 15 * 60
    };

    let timeLeft = times.work;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    window.addEventListener('click', () => {
      initAudio();
    }, { once: true });

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      document.getElementById('timer').textContent = formattedTime;
      document.title = `${formattedTime} - Focus & Flow`;
    }

    function toggleTimer() {
      initAudio();

      if (isRunning) {
        clearInterval(timerInterval);
        document.getElementById('startBtn').textContent = 'Start';
      } else {
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('startBtn').textContent = 'Start';
            playAlarm();
          }
        }, 1000);
        document.getElementById('startBtn').textContent = 'Pause';
      }
      isRunning = !isRunning;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('startBtn').textContent = 'Start';
      timeLeft = times[currentMode];
      updateDisplay();
    }

    function switchMode(mode, btnElement) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      resetTimer();
    }

    function updateCustomTimes() {
      times.work = Math.max(1, parseInt(document.getElementById('workTime').value) || 25) * 60;
      times.shortBreak = Math.max(1, parseInt(document.getElementById('shortBreakTime').value) || 5) * 60;
      times.longBreak = Math.max(1, parseInt(document.getElementById('longBreakTime').value) || 15) * 60;
      
      if (!isRunning) {
        timeLeft = times[currentMode];
        updateDisplay();
      }
    }

    function playAlarm() {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2); 

      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.9);
    }

    updateDisplay();
  </script>
</body>
</html>
