<script>
  /* =======================================
     LAST.FM LIVE MUSIC MONITOR (FREE & NO PREMIUM REQ)
  ======================================= */
  const LASTFM_USERNAME = 'Waldannnnn'; // Your username from the previous screenshot
  const LASTFM_API_KEY = '9be76fa1622c820a7e2a4dace90b6444';

  async function fetchCurrentlyPlaying() {
    if (LASTFM_USERNAME === 'YOUR_LASTFM_USERNAME' || LASTFM_API_KEY === 'YOUR_LASTFM_API_KEY') {
      renderErrorState('Configuration needed (Username / API Key missing)');
      return;
    }

    const endpoint = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USERNAME}&api_key=${LASTFM_API_KEY}&format=json&limit=1`;

    try {
      const response = await fetch(endpoint);
      const data = await response.json();

      if (data.error) {
        renderErrorState(data.message || 'Last.fm API Error');
        return;
      }

      const tracks = data.recenttracks?.track;
      if (!tracks || tracks.length === 0) {
        renderOfflineState();
        return;
      }

      const latestTrack = tracks[0];
      const isNowPlaying = latestTrack['@attr'] && latestTrack['@attr'].nowplaying === 'true';

      if (isNowPlaying) {
        document.getElementById('trackTitle').textContent = latestTrack.name;
        document.getElementById('trackArtist').textContent = latestTrack.artist['#text'];
        
        // Use album image or fallback placeholder
        const albumArtUrl = latestTrack.image && latestTrack.image[2]['#text'] 
          ? latestTrack.image[2]['#text'] 
          : 'https://via.placeholder.com/60?text=♫';
          
        document.getElementById('trackArt').src = albumArtUrl;

        // UI active indicators
        document.getElementById('statusBadge').style.color = '#1ed760';
        document.getElementById('statusText').textContent = 'Live on Device (Last.fm)';
        document.querySelector('.pulse-dot').style.display = 'inline-block';
        document.getElementById('progressFill').style.width = '100%'; // Continuous bar state
      } else {
        renderOfflineState();
      }
    } catch (err) {
      console.error('Last.fm fetch error:', err);
      renderErrorState('Network Error');
    }
  }

  function renderOfflineState() {
    document.getElementById('trackTitle').textContent = 'Paused / Idle';
    document.getElementById('trackArtist').textContent = 'Play music on your Spotify app';
    document.getElementById('trackArt').src = 'https://via.placeholder.com/60?text=♫';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('statusText').textContent = 'Offline';
    document.getElementById('statusBadge').style.color = '#94a3b8';
    document.querySelector('.pulse-dot').style.display = 'none';
  }

  function renderErrorState(msg) {
    document.getElementById('trackTitle').textContent = 'Setup Required';
    document.getElementById('trackArtist').textContent = msg;
    document.getElementById('statusText').textContent = 'Error';
    document.getElementById('statusBadge').style.color = '#ef4444';
    document.querySelector('.pulse-dot').style.display = 'none';
  }

  // Hide the old login button since Last.fm works publicly without user log in
  document.getElementById('authBtn').style.display = 'none';
  document.getElementById('nowPlayingCard').style.display = 'flex';

  // Check every 5 seconds
  fetchCurrentlyPlaying();
  setInterval(fetchCurrentlyPlaying, 5000);

  /* =======================================
     POMODORO TIMER LOGIC
  ======================================= */
  let timerInterval = null;
  let currentMode = 'work';
  let isRunning = false;
  let audioCtx = null;

  const times = {
    work: 25 * 60,
    shortBreak: 5 * 60,
    longBreak: 15 * 60
  };

  let timeLeft = times.work;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  window.addEventListener('click', () => { initAudio(); }, { once: true });

  function updateDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    document.getElementById('timer').textContent = formattedTime;
    document.title = `${formattedTime} - Focus & Flow`;
  }

  function toggleTimer() {
    initAudio();
    if (isRunning) {
      clearInterval(timerInterval);
      document.getElementById('startBtn').textContent = 'Start';
    } else {
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          document.getElementById('startBtn').textContent = 'Start';
          playAlarm();
        }
      }, 1000);
      document.getElementById('startBtn').textContent = 'Pause';
    }
    isRunning = !isRunning;
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    document.getElementById('startBtn').textContent = 'Start';
    timeLeft = times[currentMode];
    updateDisplay();
  }

  function switchMode(mode, btnElement) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    resetTimer();
  }

  function updateCustomTimes() {
    times.work = Math.max(1, parseInt(document.getElementById('workTime').value) || 25) * 60;
    times.shortBreak = Math.max(1, parseInt(document.getElementById('shortBreakTime').value) || 5) * 60;
    times.longBreak = Math.max(1, parseInt(document.getElementById('longBreakTime').value) || 15) * 60;
    
    if (!isRunning) {
      timeLeft = times[currentMode];
      updateDisplay();
    }
  }

  function playAlarm() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2); 
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.9);
  }

  updateDisplay();
</script>
